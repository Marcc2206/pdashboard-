<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1216">
  <title>Dashboard</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📰</text></svg>">
</head>
<body>
  <header class="topbar">
    <h1>Dashboard</h1>
    <div class="topbar-meta">
      <span id="clock" class="clock">--:--</span>
      <span id="status" class="status">lädt …</span>
      <button id="reload" type="button" class="reload">Aktualisieren</button>
    </div>
  </header>

  <main class="layout">
    <section class="column" aria-labelledby="news-heading">
      <h2 id="news-heading" class="column-title">Nachrichten</h2>
      <div id="news" class="cards">
        <p class="placeholder-text">Lade Feeds …</p>
      </div>
    </section>

    <aside class="column" aria-labelledby="modules-heading">
      <h2 id="modules-heading" class="column-title">Module</h2>
      <div class="cards">
        <article class="card" id="weather-card">
          <header class="card-head">
            <h3 id="weather-place">Wetter</h3>
            <span id="weather-updated" class="card-count"></span>
          </header>
          <div id="weather"><p class="placeholder-text">Lade Wetter …</p></div>
        </article>

        <article class="card" id="markets-card">
          <header class="card-head">
            <h3>Kurse</h3>
            <span id="markets-updated" class="card-count"></span>
          </header>
          <div id="markets"><p class="placeholder-text">Lade Kurse …</p></div>
        </article>

        <article class="card" id="knowledge-card">
          <header class="card-head">
            <h3>Allgemeinwissen</h3>
            <button id="knowledge-next" type="button" class="card-button">Weiter</button>
          </header>
          <div id="knowledge"><p class="placeholder-text">Lade …</p></div>
        </article>

        <article class="card" id="vocab-card">
          <header class="card-head">
            <h3>Englisch aufpolieren</h3>
            <button id="vocab-next" type="button" class="card-button">Weiter</button>
          </header>
          <div id="vocab"><p class="placeholder-text">Lade …</p></div>
        </article>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span id="generated">–</span>
    <span class="footer-note">Daten werden alle 2 Stunden per GitHub Action erneuert.</span>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
