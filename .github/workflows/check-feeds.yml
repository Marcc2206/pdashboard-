name: Feed-Adressen testen

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Feed-Adressen, durch Leerzeichen getrennt"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adressen pruefen
        run: python3 scripts/check_feeds.py ${{ inputs.urls }}
